<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Les 40 Ans d'Aline</title>
  <meta name="description" content="Célébrons ensemble les 40 ans d'Aline !">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f141d;
      --bg-card: rgba(22, 29, 41, 0.85);
      --gold: #d4af37;
      --gold-soft: #f3e5ab;
      --line: rgba(212, 175, 55, 0.25);
      --text-main: #f0f4f8;
      --text-muted: #9aa8b9;
      --font-title: 'Cormorant Garamond', serif;
      --font-body: 'Montserrat', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(ellipse at 50% 0%, rgba(212, 175, 55, 0.15) 0%, transparent 70%),
        radial-gradient(ellipse at 100% 100%, rgba(212, 175, 55, 0.08) 0%, transparent 50%);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
      padding: 20px 15px 60px 15px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 700px;
      width: 100%;
    }

    header {
      text-align: center;
      padding: 40px 20px 30px 20px;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--line);
      position: relative;
    }

    .badge {
      display: inline-block;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 0.8rem;
      color: var(--gold);
      margin-bottom: 10px;
      font-weight: 500;
    }

    h1 {
      font-family: var(--font-title);
      font-size: clamp(2.5rem, 6vw, 3.8rem);
      font-weight: 700;
      color: var(--gold-soft);
      line-height: 1.1;
      margin-bottom: 15px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    header p {
      font-size: 1.1rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 30px 25px;
      margin-bottom: 25px;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h2 {
      font-family: var(--font-title);
      font-size: 1.8rem;
      color: var(--gold);
      margin-bottom: 20px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
    }

    .info-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .info-val {
      font-size: 1.1rem;
      color: var(--text-main);
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: var(--gold-soft);
      font-weight: 500;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 15px;
      background: rgba(15, 20, 29, 0.8);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
    }

    select option {
      background: var(--bg-dark);
      color: var(--text-main);
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%);
      border: none;
      border-radius: 6px;
      color: #0f141d;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 10px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
    }

    footer {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <span class="badge">Invitation Anniversaire</span>
      <h1>Les 40 Ans d'Aline</h1>
      <p>Une décennie supplémentaire, ça se fête ensemble !</p>
    </header>

    <div class="card">
      <h2>Informations Pratiques</h2>
      <div class="info-grid">
        <div class="info-item">
          <span class="info-label">Date</span>
          <span class="info-val">À définir</span>
        </div>
        <div class="info-item">
          <span class="info-label">Heure</span>
          <span class="info-val">À partir de 19h00</span>
        </div>
        <div class="info-item">
          <span class="info-label">Lieu</span>
          <span class="info-val">À préciser</span>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Confirmation de Présence (RSVP)</h2>
      <form action="https://formspree.io/f/xeajnvab" method="POST">
        
        <div class="form-group">
          <label for="nom">Nom et Prénom :</label>
          <input type="text" id="nom" name="nom" placeholder="Ex: Jean Dupont" required>
        </div>

        <div class="form-group">
          <label for="presence">Seras-tu présent(e) ?</label>
          <select id="presence" name="presence" required>
            <option value="Oui, je serai là !">Oui, avec grand plaisir !</option>
            <option value="Non, malheureusement">Désolé(e), je ne pourrai pas venir</option>
          </select>
        </div>

        <div class="form-group">
          <label for="nombre">Nombre de personnes (toi inclus) :</label>
          <input type="number" id="nombre" name="nombre_personnes" min="1" max="10" value="1" required>
        </div>

        <div class="form-group">
          <label for="message">Un petit mot ou un régime spécifique ?</label>
          <textarea id="message" name="message" rows="4" placeholder="Ton message pour Aline..."></textarea>
        </div>

        <button type="submit">Envoyer ma réponse</button>
      </form>
    </div>

    <footer>
      <p>Hâte de vous retrouver pour fêter ça ensemble ! ✨</p>
    </footer>
  </div>

</body>
</html>
